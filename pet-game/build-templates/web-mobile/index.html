<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Cocos Creator | pet-game</title>

  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true">

  <meta name="x5-page-mode" content="app">

  <link rel="stylesheet" type="text/css" href="style.css"/>

</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
    </div>


<!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
  // 兼容补丁：cocos-cli 构建产物中的 spine 打桩模块（asm.js）初始化时抛出
  // embind "Cannot register public name '' twice"，异常中断 cc.game.init，
  // 场景永不加载（黑屏）。本工程不使用 spine，故在引擎加载 spine 运行时模块时
  // 返回空实现，保证启动链路完整。详见 README「已知构建缺陷」一节。
  (function () {
    var hasSystem = typeof System !== 'undefined' && System && System.constructor
    if (!hasSystem) {
      return
    }
    var SystemJS = System.constructor
    var prototype = SystemJS && SystemJS.prototype
    if (!prototype || typeof prototype.import !== 'function') {
      return
    }
    var originalImport = prototype.import
    var stub = { default: function () { return Promise.resolve({}) } }
    prototype.import = function (id, parentUrl) {
      if (typeof id === 'string' && id.indexOf('spine') !== -1) {
        return Promise.resolve(stub)
      }
      return originalImport.call(this, id, parentUrl)
    }
  })()
</script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err) })
</script>

</body>
</html>
