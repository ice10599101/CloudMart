# =============================================================================
# CloudMart 路由权限清单（SEC-01 / route-policy）
# =============================================================================
# 作用：
#   1. 声明全部"写路由"（以及关键读路由）的授权要求，作为代码审查与 CI 扫描基准
#      （CI 扫描 Controller 与本清单差集：ENG-01 落地）。
#   2. 身份模型：三种不可互换主体
#      - USER       普通用户（mall-auth 签发 scope=user 的 RS256 JWT，业务服务本地验签）
#      - ADMIN      管理员（mall-auth 签发 scope=admin 的 JWT；后台操作统一走 /api/admin/**）
#      - SERVICE    服务间调用（X-Service-Token 短期 HS256 令牌，路径级 iss/scope 强校验）
#   3. 裸 X-Internal-Call 头不再构成任何信任凭证（SEC-01 已废除）。
#
# 字段说明：
#   method       HTTP 方法（* 表示全部方法）
#   path         服务内路径（StripPrefix 后；完整外部路径为 /api/{service}{path}）
#   subjectType  允许的主体（USER / ADMIN / SERVICE / ANON，逗号分隔为任一即可）
#   permission   需要的能力域或权限码（SERVICE 令牌 scope；ADMIN 权限码；— 表示无）
#   serviceCaller 允许的签发方（仅 SERVICE 时有效）
#   ownerCheck   是否要求 Service 层校验资源归属（order.userId / file.owner / conversation 成员等）
#
# 网关层约束（与 ServiceInternalRouteBlockFilter 一致）：
#   - 全部业务的 /admin/** 与 /internal/** 禁止从网关外部直达（404），
#     管理端唯一合法链路：CloudMart-ui → /api/admin/**（mall-admin）→ Nacos 内部 Feign（服务令牌）。
#   - /api/gen/**、/api/job/** 不再提供匿名入口（旧 /api/gen/preview|download 公开放行已移除）。
# =============================================================================

meta:
  version: 1
  updated: "2026-09-27"
  scope: "全部 P0 写路由 + 关键内部端点；GET 公开浏览清单见各模块 SecurityConfig"

# -----------------------------------------------------------------------------
# mall-gateway 公开路径（ANY_METHOD，剥离 Authorization）
# -----------------------------------------------------------------------------
gateway-public:
  - { method: "*",   path: /api/auth/**,                        subjectType: ANON, note: "登录/刷新/注销（含管理员登录）" }
  - { method: POST,  path: /api/user/users/register,            subjectType: ANON }
  - { method: POST,  path: /api/user/users/register/code,       subjectType: ANON, note: "注册发码：网关 IP 限流 5/min + 服务层每邮箱 60s 冷却/5 次每小时" }
  - { method: POST,  path: /api/user/users/validate,            subjectType: ANON }
  - { method: POST,  path: /api/payment/payment-attempts/mock-callbacks, subjectType: ANON, note: "T01：MOCK 渠道 HMAC 验签回调（prod 禁用）；真实渠道回调按渠道 adapter 增补" }
  - { method: GET,   path: /files/**,                           subjectType: ANON, note: "mall-file 静态资源（公开 URL）" }

# -----------------------------------------------------------------------------
# mall-product
# -----------------------------------------------------------------------------
mall-product:
  - { method: GET,    path: /products/search,        subjectType: ANON }
  # N-5 商品问答（问大家）：提问/回答需登录；列表公开
  - { method: POST,   path: "/products/{productId}/questions",            subjectType: "USER", note: "SELF：内容转义+长度校验" }
  - { method: GET,    path: "/products/{productId}/questions",            subjectType: ANON }
  - { method: POST,   path: "/products/{productId}/questions/{questionId}/answer", subjectType: "USER", note: "SELF：已购徽标快照" }
  - { method: GET,    path: "/products/{id}",          subjectType: ANON }
  - { method: GET,    path: /products/skus/batch,    subjectType: ANON }
  - { method: GET,    path: /products,               subjectType: "USER,SERVICE", serviceCaller: "mall-ai,mall-cart,mall-seckill", permission: product:read }
  - { method: GET,    path: "/products/{productId}/reviews", subjectType: "USER,SERVICE", serviceCaller: mall-ai, permission: product:read }
  - { method: POST,   path: /products/es/reindex,    subjectType: SERVICE, serviceCaller: "mall-admin,mall-ai", permission: product:admin }
  - { method: POST,   path: /products/es/sync/**,    subjectType: SERVICE, serviceCaller: "mall-admin,mall-ai", permission: product:admin }
  - { method: "*",    path: /admin/**,               subjectType: SERVICE, serviceCaller: mall-admin, permission: product:admin, note: "AdminProduct/AdminCategory/AdminReview/AdminBrand" }
  - { method: POST,   path: /reviews,                subjectType: USER, ownerCheck: true, note: "CAT-03：校验 orderItem 归属与已购" }

# -----------------------------------------------------------------------------
# mall-user
# -----------------------------------------------------------------------------
mall-user:
  - { method: PUT,    path: "/admin/users/{id}/status", subjectType: SERVICE, serviceCaller: mall-admin, permission: user:admin }
  - { method: "*",    path: /admin/**,               subjectType: SERVICE, serviceCaller: "mall-admin,mall-notification", permission: user:admin, note: "/admin/users 读路径允许 mall-notification" }
  - { method: GET,    path: /users/batch,            subjectType: ANON }
  - { method: GET,    path: /users/search,           subjectType: ANON }

# -----------------------------------------------------------------------------
# mall-order
# -----------------------------------------------------------------------------
mall-order:
  - { method: POST,   path: /orders,                        subjectType: USER, ownerCheck: true, note: "TRADE-01/02：报价+幂等" }
  - { method: PUT,    path: "/orders/{orderId}/cancel",       subjectType: USER, ownerCheck: true }
  - { method: POST,   path: "/orders/{orderId}/pay",          subjectType: USER, ownerCheck: true }
  - { method: PUT,    path: "/orders/{orderId}/confirm",      subjectType: USER, ownerCheck: true }
  - { method: POST,   path: "/orders/{orderId}/refund",       subjectType: USER, ownerCheck: true, note: "TRADE-03：转售后单" }
  - { method: POST,   path: /orders/timeout-cancel,         subjectType: SERVICE, serviceCaller: mall-job, permission: order:jobs }
  - { method: POST,   path: "/internal/orders/payment-success/{orderId}", subjectType: SERVICE, serviceCaller: mall-payment, permission: order:internal, note: "TRADE-04：状态 CAS" }
  - { method: POST,   path: "/internal/orders/cancel-notify/{orderId}",   subjectType: SERVICE, serviceCaller: mall-payment, permission: order:internal }
  - { method: "*",    path: /admin/**,                      subjectType: SERVICE, serviceCaller: mall-admin, permission: order:admin }

# -----------------------------------------------------------------------------
# mall-payment
# -----------------------------------------------------------------------------
mall-payment:
  - { method: POST,   path: "/internal/refunds",        subjectType: SERVICE, serviceCaller: mall-order, permission: order:refund, note: "T02：内部退款（refundNo 幂等，超退核算）" }
  - { method: GET,    path: "/internal/refunds/{refundNo}", subjectType: SERVICE, serviceCaller: mall-order, permission: order:refund, note: "T02：渠道退款状态查询" }
  - { method: POST,   path: "/payment-attempts",        subjectType: USER, ownerCheck: true, note: "T01：只收 orderId+channel，归属/金额服务端判定" }
  - { method: GET,    path: "/payment-attempts/order/{orderId}", subjectType: USER, ownerCheck: true, note: "T01：收银台轮询真值源" }
  - { method: POST,   path: "/payment-attempts/mock-callbacks", subjectType: ANON, note: "T01：MOCK 渠道 HMAC 验签回调，prod 禁用" }
  - { method: "*",    path: /admin/**,                  subjectType: SERVICE, serviceCaller: mall-admin, permission: payment:admin }

# -----------------------------------------------------------------------------
# mall-inventory
# -----------------------------------------------------------------------------
mall-inventory:
  - { method: POST,   path: /internal/inventory/deduct,   subjectType: SERVICE, serviceCaller: mall-order, permission: inventory:trade, note: "STOCK-01：预占台账" }
  - { method: POST,   path: /internal/inventory/release,  subjectType: SERVICE, serviceCaller: mall-order, permission: inventory:trade }
  - { method: POST,   path: /internal/inventory/confirm,  subjectType: SERVICE, serviceCaller: mall-order, permission: inventory:trade }
  - { method: POST,   path: /internal/inventory/init,     subjectType: SERVICE, serviceCaller: mall-order, permission: inventory:trade }
  - { method: GET,    path: "/internal/inventory/skus/{skuId}", subjectType: SERVICE, serviceCaller: mall-order, permission: inventory:trade }
  - { method: "*",    path: /admin/**,                    subjectType: SERVICE, serviceCaller: mall-admin, permission: inventory:admin }

# -----------------------------------------------------------------------------
# mall-cart
# -----------------------------------------------------------------------------
mall-cart:
  - { method: DELETE, path: /checked,            subjectType: "USER,SERVICE", serviceCaller: mall-order, permission: cart:trade, note: "TRADE-02：改为精确清理本次购买行" }
  - { method: "*",    path: /admin/**,           subjectType: SERVICE, serviceCaller: mall-admin, permission: cart:admin }

# -----------------------------------------------------------------------------
# mall-coupon
# -----------------------------------------------------------------------------
mall-coupon:
  - { method: POST,   path: /user-coupons/claim,    subjectType: USER, note: "COUPON-01：领取限额原子化" }
  - { method: POST,   path: /user-coupons/use,      subjectType: SERVICE, serviceCaller: mall-order, permission: coupon:trade }
  - { method: POST,   path: /user-coupons/confirm,  subjectType: SERVICE, serviceCaller: mall-order, permission: coupon:trade, note: "T06：支付成功核销确认 RESERVED→USED" }
  - { method: POST,   path: /user-coupons/return,   subjectType: SERVICE, serviceCaller: mall-order, permission: coupon:trade }
  - { method: POST,   path: /coupons/expire-batch,  subjectType: SERVICE, serviceCaller: mall-job, permission: coupon:jobs, note: "旧匿名写入口已封闭" }
  - { method: "*",    path: /admin/**,              subjectType: SERVICE, serviceCaller: mall-admin, permission: coupon:admin }

# -----------------------------------------------------------------------------
# mall-seckill / mall-marketing
# -----------------------------------------------------------------------------
mall-seckill:
  - { method: POST,   path: /execute,              subjectType: "USER,SERVICE", serviceCaller: mall-live, permission: seckill:execute, note: "PROMO-01" }
  - { method: "*",    path: /admin/**,             subjectType: SERVICE, serviceCaller: mall-admin, permission: seckill:admin }

mall-marketing:
  - { method: POST,   path: /marketing/group/expiration, subjectType: SERVICE, serviceCaller: mall-job, permission: marketing:jobs }
  - { method: "*",    path: /admin/**,                   subjectType: SERVICE, serviceCaller: mall-admin, permission: marketing:admin }

# -----------------------------------------------------------------------------
# mall-wms / mall-community / mall-notification / mall-live / mall-ai / mall-risk
# -----------------------------------------------------------------------------
mall-wms:
  - { method: "*",    path: /admin/**,           subjectType: SERVICE, serviceCaller: mall-admin, permission: wms:admin, note: "WMS-01：补订单归属校验" }

mall-community:
  - { method: "*",    path: /internal/**,        subjectType: SERVICE, serviceCaller: "mall-user,mall-notification", permission: community:internal, note: "P2-24：私信拉黑校验经 /internal/blocks/status" }
  - { method: "*",    path: /admin/**,           subjectType: SERVICE, serviceCaller: mall-admin, permission: community:admin }

mall-notification:
  - { method: "*",    path: /internal/**,        subjectType: SERVICE, serviceCaller: "mall-job,mall-pet", permission: notification:internal }
  - { method: "*",    path: /admin/**,           subjectType: SERVICE, serviceCaller: mall-admin, permission: notification:admin }

mall-wish:
  # 擦肩而过恢复（2026-10 产品决策反转：补用户端入口，信笺与漂流瓶并存）
  - { method: "*",  path: /map/nearby-mode,                  subjectType: "USER", note: "SELF：Redis 开关即本人" }
  - { method: "*",  path: /map/trace,                        subjectType: "USER", note: "SELF：伪造检测/限频/冻结" }
  - { method: "*",  path: /encounter-letters/**,             subjectType: "USER", note: "SELF：归属校验" }
  - { method: "*",  path: /admin/encounter/**,               subjectType: SERVICE, serviceCaller: mall-admin, note: "类级 INTERNAL 守卫" }
  # T22：主播自助挂件配置（streamerId 强制当前用户本人）
  - { method: POST, path: /live/widget/config,               subjectType: "USER", note: "SELF：服务端强制本人" }

mall-live:
  - { method: "*",    path: /internal/**,        subjectType: SERVICE, serviceCaller: "mall-job,mall-wish", permission: live:internal }
  - { method: "*",    path: /admin/**,           subjectType: SERVICE, serviceCaller: mall-admin, permission: live:admin, note: "LIVE-01：WS 写入口握手鉴权" }

mall-ai:
  - { method: POST,   path: /chat,               subjectType: "USER,SERVICE", serviceCaller: mall-admin, permission: ai:admin, ownerCheck: true }
  - { method: GET,    path: /search,             subjectType: "USER,SERVICE", serviceCaller: mall-admin, permission: ai:admin }
  - { method: "*",    path: /admin/**,           subjectType: SERVICE, serviceCaller: mall-admin, permission: ai:admin }

mall-risk:
  - { method: "*",    path: /blacklist/**,       subjectType: SERVICE, serviceCaller: mall-admin, permission: risk:admin }
  - { method: "*",    path: /records/**,         subjectType: SERVICE, serviceCaller: mall-admin, permission: risk:admin }
  - { method: "*",    path: /rules/**,           subjectType: SERVICE, serviceCaller: mall-admin, permission: risk:admin }
  - { method: "*",    path: /internal/**,        subjectType: SERVICE, serviceCaller: "mall-auth,mall-order,mall-payment,mall-seckill,mall-user,mall-job", permission: risk:internal, note: "RISK-01：业务接入" }

# -----------------------------------------------------------------------------
# mall-auth / mall-admin / mall-job / mall-gen / mall-file
# （S05：mall-auth 只保留一个顶层键，合并发卡方匿名路由与内部令牌撤销路由）
# -----------------------------------------------------------------------------
mall-auth:
  - { method: "*",    path: /**,                 subjectType: ANON, note: "登录/刷新/JWKS（/internal/** 除外）；SEC-02/03：刷新令牌身份域隔离与会话撤销" }
  - { method: POST,   path: /internal/tokens/revoke-subject, subjectType: SERVICE, serviceCaller: "mall-admin,mall-user", permission: admin:auth, note: "SEC-02：踢人/禁用时按主体撤销令牌家族" }
  - { method: POST,   path: /internal/tokens/invalidate-state, subjectType: SERVICE, serviceCaller: "mall-admin,mall-user", permission: admin:auth, note: "SEC-03：禁用/改密硬失效；改权限软失效" }
  - { method: POST,   path: /logout,                subjectType: USER, ownerCheck: true, note: "SEC-03：撤销当前会话+全部刷新家族" }

mall-admin:
  - { method: POST,   path: /auth/validate,             subjectType: SERVICE, serviceCaller: mall-auth, permission: admin:auth }
  - { method: GET,    path: "/auth/permissions/{userId}", subjectType: SERVICE, serviceCaller: mall-auth, permission: admin:auth }
  - { method: POST,   path: /logs/login/record,         subjectType: SERVICE, serviceCaller: mall-auth, permission: admin:auth }
  - { method: "*",    path: /**,                        subjectType: ADMIN, note: "网关 AdminAuthGlobalFilter 强制 X-Admin-Role；拦截器 @RequiresAdmin/@RequiresPermission" }

mall-job:
  - { method: "*",    path: /**,                 subjectType: ADMIN, note: "管理员 JWT 直连；@RequiresPermission 已由统一拦截器执行（JOB-01）" }

mall-gen:
  - { method: "*",    path: /**,                 subjectType: ADMIN, note: "开发工具：管理员 JWT；生产建议仅内网入口" }

mall-file:
  - { method: POST,   path: "/assets",           subjectType: "USER,ADMIN", ownerCheck: true, note: "S01：唯一资产入口（配额+内容校验+可见性分域+归属台账）" }
  - { method: DELETE, path: "/assets/{id}",      subjectType: "USER,ADMIN", ownerCheck: true, note: "S01：按 fileId 归属授权删除（引用检查+DELETING CAS）" }
  - { method: GET,    path: "/assets/{id}/download-url", subjectType: "USER,ADMIN", ownerCheck: true, note: "S01：私有附件短期签名授权" }
  - { method: GET,    path: "/assets/{id}/download",     subjectType: ANON, note: "S01：凭短期 HMAC token 下载（本身即授权凭证）" }
