server:
  port: 9007

spring:
  application:
    name: mall-coupon
  autoconfigure:
    exclude: org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
  config:
    import:
      - nacos:shared-runtime.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:mall-coupon.yml?refreshEnabled=true
      - optional:nacos:shared-logging.yml?group=DEFAULT_GROUP&refresh=true
  cloud:
    inetutils:
      preferred-networks:
        - 192.168.1.
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
    sentinel:
      transport:
        dashboard: 127.0.0.1:8088
        port: 8725
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:8306}/mall_coupon?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    ignore-migration-patterns: []
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:8379}
      # Lettuce 默认命令超时 60s；服务器端口转发抖动时半开连接会拖死请求。
      # 3s 快速失败（与 mall-wish 对齐，见进度文件四K 第八轮）
      timeout: 3s
      connect-timeout: 2s

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: cloudmart-tx-group
  service:
    vgroup-mapping:
      cloudmart-tx-group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}
  registry:
    type: file
  config:
    type: file

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # P2-21 生产硬化：默认 INFO（原 DEBUG 仅本地联调用）。
    # 本地调试用环境变量覆盖，如 LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_OPENFEIGN=DEBUG
    com.cloudmart.admin.feign: INFO
    org.springframework.cloud.openfeign: INFO
    org.springframework.cloud.loadbalancer: INFO
    com.alibaba.nacos.client: INFO
    com.alibaba.csp.sentinel: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# SEC-01 统一身份边界：用户/管理员 JWT 本地验签（RS256/JWKS），服务间调用以
# X-Service-Token 短期签名令牌认证（与全站共享 CLOUDMART_SERVICE_TOKEN_SECRET）。
# 裸 X-Internal-Call 头不再构成任何信任凭证。
cloudmart:
  security:
    service-id: mall-coupon
    service-token-secret: ${CLOUDMART_SERVICE_TOKEN_SECRET:}
    jwks-uri: ${CLOUDMART_SECURITY_JWKS_URI:http://127.0.0.1:9001/oauth2/jwks}
    clock-skew-seconds: 30
    service-token-ttl-seconds: 60
    # RISK-01 补配（0f5e8f91 遗漏）：领券前置风控出站签名——RiskFeignClient 注释
    # 声称 outbound-scopes[mall-risk]=risk:check，但仓库 yml 从未落该键，
    # coupon 裸调 risk 被拒 → claimCoupon 恒降级 COUPON_SERVICE_DEGRADED。
    outbound-scopes:
      mall-risk: risk:check
    service-token-paths:
      - prefix: /admin
        issuers: [mall-admin]
        scope: coupon:admin
      # E02：批量过期统一 /internal 路由（最长前缀优先于 /internal）
      - prefix: /internal/coupons/expire-batch
        issuers: [mall-job]
        scope: coupon:jobs
      # R01：pet 权益核验读取兑换码权威事实（只读；最长前缀优先于下方 /internal）
      - prefix: /internal/exchange-codes
        issuers: [mall-pet]
        scope: coupon:redeem
      - prefix: /user-coupons
        issuers: [mall-order]
        scope: coupon:trade
      - prefix: /internal
        issuers: [mall-order]
        scope: coupon:trade

# E03：公开文档按需关闭——生产部署注入 SPRINGDOC_API_DOCS_ENABLED=false 与
# SPRINGDOC_SWAGGER_UI_ENABLED=false；dev/test 保持默认开启
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
