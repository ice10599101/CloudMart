apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-pet
  namespace: cloudmart
  labels:
    app: mall-pet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mall-pet
  template:
    metadata:
      labels:
        app: mall-pet
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9023"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      initContainers:
        - name: skywalking-agent
          image: apache/skywalking-java-agent:9.0.0-java21
          command: ['sh', '-c', 'cp -r /skywalking/agent /skywalking/agent-shared']
          volumeMounts:
            - name: skywalking-agent
              mountPath: /skywalking/agent-shared
      containers:
        - name: mall-pet
          image: cloudmart/mall-pet:latest
          ports:
            - containerPort: 9023
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: NACOS_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: nacos-addr
            - name: CLOUDMART_SECURITY_JWKS_URI
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: jwks-uri
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseZGC -javaagent:/skywalking/agent/skywalking-agent.jar"
            - name: SW_AGENT_NAME
              value: "mall-pet"
            - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
              value: "skywalking-oap.cloudmart.svc.cluster.local:11800"
          envFrom:
            - secretRef:
                name: cloudmart-secrets
          volumeMounts:
            - name: skywalking-agent
              mountPath: /skywalking/agent
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9023
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9023
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: skywalking-agent
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mall-pet
  namespace: cloudmart
spec:
  selector:
    app: mall-pet
  ports:
    - port: 9023
      targetPort: 9023
  type: ClusterIP
