name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: 后端全模块编译与单测（24 模块）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: 工具链版本（E01 可复现基线）
        run: chmod +x mvnw && ./mvnw -version
      # E01：从根 POM 构建全部模块，禁止再维护模块子集清单
      - name: 全模块单元测试
        run: ./mvnw -B -ntp test
      - name: 失败摘要（转 annotation 便于远程诊断）
        if: failure()
        run: |
          for f in $(find . -name "*.txt" -path "*surefire-reports*"); do
            grep -E "Tests run: [0-9]+, Failures: [1-9]|Errors: [1-9]" "$f" | while read -r line; do
              echo "::error::[$f] $line"
            done
            grep -A6 "<<< FAILURE!\|<<< ERROR!" "$f" | head -24 | while read -r line; do
              echo "::error::[detail] $line"
            done
          done

  backend-integration:
    name: 后端集成测试（Testcontainers / 真实基础设施）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Windows 开发的仓库不带 +x 位：不 chmod 则 ./mvnw 以 exit 126 失败
      - name: 赋予 mvnw 执行权限
        run: chmod +x mvnw
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      # E01：*IntegrationTest 由 failsafe 执行，报告落 target/failsafe-reports；
      # 集成测试数量为 0 也视为失败（防止 IT 被静默跳过）
      - name: 检查集成测试存在
        run: |
          count=$(find mall-*/src/test -name '*IntegrationTest.java' | wc -l)
          echo "IntegrationTest 文件数: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::未发现任何 *IntegrationTest.java，集成测试门禁失效"; exit 1
          fi
      # E01：*IntegrationTest 由 failsafe 执行，报告落 target/failsafe-reports；
      # 其余模块 IT 均为 Testcontainers 自给自足（runner 自带 Docker）。
      # mall-wish IT 依赖远程 IT 容器（mysql-it 8307 / redis-it 8380，B23 显式授权环境），
      # CI runner 不持有其授权，排除该模块——wish IT 仅在授权环境以 -Dwish.it.enabled=true 执行
      - name: 集成测试（-Pintegration-test → failsafe verify；mall-wish 除外）
        run: ./mvnw -B -ntp -Pintegration-test verify -pl '!mall-wish'
      - name: 上传集成测试报告（失败排障）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/**'
          retention-days: 7
      - name: 集成测试执行数校验（防止 IT 被静默跳过）
        run: |
          total=$(find . -path "*failsafe-reports*" -name "*.txt" -exec grep -hE "^Tests run:" {} \; | awk -F'[:,]' '{s+=$2} END {print s+0}')
          echo "failsafe 实际执行测试数: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::failsafe 未执行任何集成测试"; exit 1
          fi
      # E01：迁移干净建库验证——全新 MySQL 逐模块 Flyway migrate（可恢复性核心验证）
      - name: 迁移干净建库验证（全部模块 V1..Vn 从零执行）
        run: |
          docker run -d --name clean-db -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=clean_check             -p 33061:3306 mysql:9.4.0
          for i in $(seq 1 30); do
            docker exec clean-db mysqladmin ping -uroot -proot --silent && break
            sleep 2
          done
          failed=0
          for dir in mall-*/src/main/resources/db/migration; do
            module=$(echo "$dir" | cut -d/ -f1)
            echo "::group::Flyway migrate: $module"
            if ./mvnw -B -ntp -q org.flywaydb:flyway-maven-plugin:11.14.1:migrate               -Dflyway.url="jdbc:mysql://127.0.0.1:33061/clean_check?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"               -Dflyway.user=root -Dflyway.password=root               -Dflyway.locations="filesystem:$PWD/$dir"; then
              echo "OK: $module"
            else
              echo "::error::迁移失败: $module"; failed=1
            fi
            echo "::endgroup::"
          done
          docker rm -f clean-db >/dev/null 2>&1 || true
          exit $failed
      - name: 失败摘要
        if: failure()
        run: |
          for f in $(find . -name "*.txt" -path "*failsafe-reports*"); do
            grep -E "Tests run: [0-9]+, Failures: [1-9]|Errors: [1-9]" "$f" | while read -r line; do
              echo "::error::[$f] $line"
            done
          done

  frontend:
    name: 三端类型检查、单测与生产构建
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: CloudMart-ui
            cmds: npx tsc --noEmit && npx vitest run --maxWorkers=1 --pool=threads && npm run build
          - dir: cloudmart-app
            cmds: npx tsc --noEmit && npx expo export --platform web
          - dir: cloudmart-mobile
            cmds: npx tsc --noEmit && npm run build:h5 && npm run build:weapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: 环境信息
        run: node --version && npm --version
      - name: 安装依赖（锁文件严格模式）
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: 校验与生产构建
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmds }}
      - name: 失败摘要
        if: failure()
        run: echo "::error::dir=${{ matrix.dir }} node=$(node --version) npm=$(npm --version) 上一步失败，见上方日志"

  guards:
    name: 仓库守门（路由策略 + 密钥扫描）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: 路由权限清单 lint（S05：重复键/非法 YAML/必填字段）
        run: node scripts/ci/route-policy-lint.mjs
      - name: 密钥泄漏扫描（gitleaks）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
