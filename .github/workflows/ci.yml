name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: 后端全模块编译与单测（24 模块）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: 工具链版本（E01 可复现基线）
        run: chmod +x mvnw && ./mvnw -version
      # E01：从根 POM 构建全部模块，禁止再维护模块子集清单
      - name: 全模块单元测试
        # MAVEN_OPTS 固定堆（runner 3.5GB ubuntu-latest，24 模块 fork 测试 JVM 易 OOM）
        run: MAVEN_OPTS="-Xmx1536m" ./mvnw -B -ntp test
      - name: 上传单测报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
      - name: 失败摘要（转 annotation 便于远程诊断）
        if: failure()
        run: |
          for f in $(find . -name "*.txt" -path "*surefire-reports*"); do
            grep -E "Tests run: [0-9]+, Failures: [1-9]|Errors: [1-9]" "$f" | while read -r line; do
              echo "::error::[$f] $line"
            done
            grep -A6 "<<< FAILURE!\|<<< ERROR!" "$f" | head -24 | while read -r line; do
              echo "::error::[detail] $line"
            done
          done

  backend-integration:
    name: 后端集成测试（Testcontainers / 真实基础设施）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Windows 开发的仓库不带 +x 位：不 chmod 则 ./mvnw 以 exit 126 失败
      - name: 赋予 mvnw 执行权限
        run: chmod +x mvnw
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      # E01：*IntegrationTest 由 failsafe 执行，报告落 target/failsafe-reports；
      # 集成测试数量为 0 也视为失败（防止 IT 被静默跳过）
      - name: 检查集成测试存在
        run: |
          count=$(find mall-*/src/test -name '*IntegrationTest.java' | wc -l)
          echo "IntegrationTest 文件数: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::未发现任何 *IntegrationTest.java，集成测试门禁失效"; exit 1
          fi
      # E01/T26：*IntegrationTest 由 failsafe 执行，报告落 target/failsafe-reports；
      # 全部模块 IT 均为 Testcontainers 自给自足（runner 自带 Docker）——
      # mall-wish 已改造为双模式（默认 Testcontainers；WISH_IT_MYSQL_HOST 显式
      # 设置时走授权环境共享实例 + B23 授权标志），不再依赖私人远程机器
      - name: 集成测试（-Pintegration-test → failsafe verify，全模块）
        run: ./mvnw -B -ntp -Pintegration-test verify
      - name: 上传集成测试报告（失败排障）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/**'
          retention-days: 7
      # R26：门禁校验——执行数 > 0 且 skipped == 0。disabledWithoutDocker/skip 激活时
      # failsafe 报告 Skipped>0 或总数为 0，此前只看 Tests run 总数会把跳过误当执行
      - name: 集成测试执行数校验（执行>0 且 skipped=0，防止 IT 被静默跳过）
        run: |
          total=$(find . -path "*failsafe-reports*" -name "*.txt" -exec grep -hE "^Tests run:" {} \; | awk -F'[:,]' '{s+=$2} END {print s+0}')
          skipped=$(find . -path "*failsafe-reports*" -name "*.txt" -exec grep -hE "^Tests run:" {} \; | awk -F'[:,]' '{for(i=1;i<=NF;i++) if($i ~ /Skipped/) {gsub(/ /,"",$(i+1)); s+=$(i+1)}} END {print s+0}')
          echo "failsafe 执行: $total, skipped: $skipped"
          if [ "$total" -eq 0 ]; then
            echo "::error::failsafe 未执行任何集成测试"; exit 1
          fi
          # 已核准的显式禁用白名单：mall-ai VectorSearch IT（ES 9.0.2 与 Spring AI
          # knn DSL 不兼容，向量能力未启用，见该 @Disabled 注记）= 3 skipped
          allowed_skipped=3
          if [ "$skipped" -ne "$allowed_skipped" ]; then
            echo "::error::集成测试 skipped=$skipped 与核准白名单（$allowed_skipped）不符——新增禁用须同步更新白名单"; exit 1
          fi
      # R26：宠物模块专属门禁——发布阻断级改造要求 mall-pet 专属 IT 非零
      - name: 宠物模块专属 IT 门禁
        run: |
          pet_total=$(find mall-pet -path "*failsafe-reports*" -name "*.txt" -exec grep -hE "^Tests run:" {} \; | awk -F'[:,]' '{s+=$2} END {print s+0}')
          echo "mall-pet failsafe 执行数: $pet_total"
          if [ "$pet_total" -eq 0 ]; then
            echo "::error::mall-pet 专属集成测试未执行（宠物发布门禁要求非零）"; exit 1
          fi
      # R26：迁移干净建库验证——每模块独立数据库（同一库会混入不同模块的同版本号
      # V1/V2，flyway history 污染导致假绿/假红），并校验 history 非空
      - name: 迁移干净建库验证（每模块独立库，V1..Vn 从零执行）
        run: |
          docker run -d --name clean-db -e MYSQL_ROOT_PASSWORD=root             -p 33061:3306 mysql:9.4.0
          # mysqladmin ping 在初始化阶段（root 密码未就绪）也返回存活——必须用
          # 真实认证探测就绪，否则首个 DROP DATABASE 即 1045，全部模块迁移假失败
          ready=0
          for i in $(seq 1 60); do
            if docker exec clean-db mysql -uroot -proot -e "SELECT 1" >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::clean-db 120s 内未就绪（真实认证探测失败）"; exit 1
          fi
          failed=0
          # flyway-maven-plugin 直接 CLI 调用的类路径无 flyway-mysql 数据库插件
          # （No Flyway database plugin found）——改用官方 Flyway Docker CLI（内置 MySQL 支持）
          for dir in mall-*/src/main/resources/db/migration; do
            module=$(echo "$dir" | cut -d/ -f1)
            db="clean_${module}"
            docker exec clean-db mysql -uroot -proot             -e "DROP DATABASE IF EXISTS \`${db}\`; CREATE DATABASE \`${db}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
            echo "::group::Flyway migrate: $module → $db"
            if docker run --rm --network host                 -v "$PWD/$dir:/flyway/sql:ro"                 flyway/flyway:11                 -url="jdbc:mysql://127.0.0.1:33061/${db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"                 -user=root -password=root                 -locations=filesystem:/flyway/sql migrate; then
              rows=$(docker exec clean-db mysql -uroot -proot -N              -e "SELECT COUNT(*) FROM \`${db}\`.flyway_schema_history WHERE success=1;")
              echo "OK: $module (history rows=$rows)"
              if [ "$rows" -eq 0 ]; then
                echo "::error::$module 迁移后 history 为空（可能整个 locations 未被加载）"; failed=1
              fi
            else
              echo "::error::迁移失败: $module"; failed=1
            fi
            echo "::endgroup::"
          done
          docker rm -f clean-db >/dev/null 2>&1 || true
          exit $failed
      # T26 第 4 点：存量库续跑路径——migrate 到次末版本模拟存量库，再续跑到 head
      # （等价真实发布滚动升级；空库路径由上一步覆盖）
      - name: 存量库续跑验证（次末版本 → head）
        run: |
          docker run -d --name upgrade-db -e MYSQL_ROOT_PASSWORD=root -p 33061:3306 mysql:9.4.0
          ready=0
          for i in $(seq 1 60); do
            if docker exec upgrade-db mysql -uroot -proot -e "SELECT 1" >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::upgrade-db 120s 内未就绪"; exit 1
          fi
          failed=0
          for dir in mall-*/src/main/resources/db/migration; do
            module=$(echo "$dir" | cut -d/ -f1)
            db="upgrade_${module}"
            last=$(ls "$dir" | grep -oE '^V[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
            prev=$(ls "$dir" | grep -oE '^V[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -2 | head -1)
            if [ -z "$prev" ]; then
              echo "SKIP: $module 仅 1 个版本"; continue
            fi
            echo "::group::存量续跑: $module (V${prev} → V${last})"
            docker exec upgrade-db mysql -uroot -proot -e "DROP DATABASE IF EXISTS \`${db}\`; CREATE DATABASE \`${db}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
            fly() {
              docker run --rm --network host                 -v "$PWD/$dir:/flyway/sql:ro"                 flyway/flyway:11                 -url="jdbc:mysql://127.0.0.1:33061/${db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"                 -user=root -password=root -locations=filesystem:/flyway/sql "$@"
            }
            if ! fly -target="$prev" migrate; then
              echo "::error::$module 迁移到次末版本 V${prev} 失败"; failed=1; echo "::endgroup::"; continue
            fi
            if ! fly migrate; then
              echo "::error::$module 存量库 V${prev} → V${last} 续跑失败"; failed=1; echo "::endgroup::"; continue
            fi
            echo "OK: $module 续跑通过"
            echo "::endgroup::"
          done
          docker rm -f upgrade-db >/dev/null 2>&1 || true
          exit $failed
      - name: 失败摘要
        if: failure()
        run: |
          for f in $(find . -name "*.txt" -path "*failsafe-reports*"); do
            grep -E "Tests run: [0-9]+, Failures: [1-9]|Errors: [1-9]" "$f" | while read -r line; do
              echo "::error::[$f] $line"
            done
          done

  frontend:
    name: 三端类型检查、单测与生产构建
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: CloudMart-ui
            cmds: npx tsc --noEmit && npx vitest run --maxWorkers=1 --pool=threads && npm run build
          - dir: cloudmart-app
            cmds: npx tsc --noEmit && npx expo export --platform web
          - dir: cloudmart-mobile
            cmds: npx tsc --noEmit && npm run build:h5 && npm run build:weapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: 环境信息
        run: node --version && npm --version
      - name: 安装依赖（锁文件严格模式）
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: 校验与生产构建
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmds }}
      - name: 失败摘要
        if: failure()
        run: echo "::error::dir=${{ matrix.dir }} node=$(node --version) npm=$(npm --version) 上一步失败，见上方日志"

  guards:
    name: 仓库守门（路由策略 + 密钥扫描）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: 路由权限清单 lint（S05：重复键/非法 YAML/必填字段）
        run: node scripts/ci/route-policy-lint.mjs
      - name: 路由清单对照真实 Controller（T25：新增未归类写路由阻断；存量欠账见 baseline）
        run: node scripts/ci/route-inventory.mjs
      - name: 密钥泄漏扫描（gitleaks）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
