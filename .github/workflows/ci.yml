name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: 后端全模块编译与单测（24 模块）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: 工具链版本（E01 可复现基线）
        run: chmod +x mvnw && ./mvnw -version
      # ubuntu-latest 免费 runner 磁盘 ~14GB；24 模块 + maven 缓存易触顶（表现为
      # 编译期静默失败/进程 137）。PET-24：预装 SDK（Android/dotnet/ghc 等 ~25GB）
      # 与本项目无关，回收后 df 应有 ~40GB 余量——10-04 起 backend job 连红且
      # 本地全 reactor 全绿，资源触顶为最大嫌疑
      - name: 磁盘回收（预装 SDK 与本仓无关）
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup             /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm/temurin-8-jdk-amd64 || true
          df -h / | tail -1 && free -m | head -2
      # E01：从根 POM 构建全部模块，禁止再维护模块子集清单
      - name: 全模块单元测试
        # MAVEN_OPTS 固定堆（runner 3.5GB ubuntu-latest，24 模块 fork 测试 JVM 易 OOM）；
        # -fa（fail-at-end）单模块失败后其余模块照跑；日志落盘供失败摘要步分析
        run: MAVEN_OPTS="-Xmx1536m" ./mvnw -B -ntp --fail-at-end test 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}
      - name: 失败定位（reactor 摘要 + OOM 特征 + 失败用例）
        if: failure()
        run: |
          # 关键行转 annotation（无需管理员即可从 check-run API/PR 界面读）
          grep -E 'FATAL|ERROR.*POM|Non-readable|exit value|EXIT_CODE| mvnw ' /tmp/build.log | head -8 | while read -r l; do echo "::error::$l"; done || true
          echo "::group::模块级 reactor 摘要"
          grep -E 'SUCCESS \[|FAILURE \[|SKIPPED$' /tmp/build.log | head -30 || true
          echo "::endgroup::"
          echo "::group::OOM/进程特征"
          grep -iE 'outofmemory|killed|exit code 137|cannot allocate|metaspace|error=.*attach' /tmp/build.log | head -10 || true
          echo "::endgroup::"
          echo "::group::失败用例（前 20 条）"
          grep -E '<<< FAILURE!|<<< ERROR!' /tmp/build.log | head -20 || true
          echo "::endgroup::"
          echo "::group::构建尾部 80 行（ERROR/编译失败在此）"
          tail -80 /tmp/build.log
          echo "::endgroup::"
      - name: 上传单测报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
      - name: 上传构建全文日志（连红诊断）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7
      - name: 失败摘要（转 annotation 便于远程诊断）
        if: failure()
        run: |
          for f in $(find . -name "*.txt" -path "*surefire-reports*"); do
            grep -E "Tests run: [0-9]+, Failures: [1-9]|Errors: [1-9]" "$f" | while read -r line; do
              echo "::error::[$f] $line"
            done
            grep -A6 "<<< FAILURE!\|<<< ERROR!" "$f" | head -24 | while read -r line; do
              echo "::error::[detail] $line"
            done
          done

  backend-integration:
    name: 后端集成测试（Testcontainers / 真实基础设施）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Windows 开发的仓库不带 +x 位：不 chmod 则 ./mvnw 以 exit 126 失败
      - name: 赋予 mvnw 执行权限
        run: chmod +x mvnw
      - name: 磁盘回收（同 backend job；IT 另需拉取 MySQL 容器镜像）
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup             /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      # E01：*IntegrationTest 由 failsafe 执行，报告落 target/failsafe-reports；
      # 集成测试数量为 0 也视为失败（防止 IT 被静默跳过）
      - name: 检查集成测试存在
        run: |
          count=$(find mall-*/src/test -name '*IntegrationTest.java' | wc -l)
          echo "IntegrationTest 文件数: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::未发现任何 *IntegrationTest.java，集成测试门禁失效"; exit 1
          fi
      # 预拉取 IT 基础镜像（并发拉取失败/超时是 CI 上 Testcontainers 启动期失败主因；
      # docker pull 幂等，预拉后 Testcontainers 复用本地层）
      - name: 预拉取 IT 镜像
        run: |
          for img in mysql:9.7.0 mysql:9.0 redis:7.4-alpine docker.elastic.co/elasticsearch/elasticsearch:9.4.0; do
            docker pull "$img" || echo "::warning::预拉取失败（继续，Testcontainers 会自行重试）: $img"
          done
      # E01/T26：*IntegrationTest 由 failsafe 执行，报告落 target/failsafe-reports；
      # 全部模块 IT 均为 Testcontainers 自给自足（runner 自带 Docker）——
      # mall-wish 已改造为双模式（默认 Testcontainers；WISH_IT_MYSQL_HOST 显式
      # 设置时走授权环境共享实例 + B23 授权标志），不再依赖私人远程机器
      - name: 集成测试（-Pintegration-test → failsafe verify，全模块）
        # 日志落盘：failsafe 全绿时 verify 仍可能败在 test-compile（如 MapStruct
        # Unmapped ERROR——问题 matcher 的 annotation 无模块定位），全文日志才可归因
        run: ./mvnw -B -ntp -Pintegration-test verify 2>&1 | tee /tmp/it-build.log; exit ${PIPESTATUS[0]}
      - name: 上传集成测试报告（失败排障）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/**'
          retention-days: 7
      - name: 上传集成构建全文日志（编译期失败归因）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: it-build-log
          path: /tmp/it-build.log
          retention-days: 7
      # R26/R28：执行数 > 0 防 IT 整体被静默跳过；skipped 身份不再数数量，
      # 交由下一步 check-it-skips.mjs 做"精确测试ID+原因+期限"白名单门禁
      - name: 集成测试执行数校验（执行>0，防止 IT 被静默跳过）
        run: |
          total=$(find . -path "*failsafe-reports*" -name "*.txt" -exec grep -hE "^Tests run:" {} \; | awk -F'[:,]' '{s+=$2} END {print s+0}')
          echo "failsafe 执行总数: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::failsafe 未执行任何集成测试"; exit 1
          fi
      # R28：skipped 精确门禁——解析 failsafe XML，每个被跳过的用例必须命中
      # scripts/ci/it-skip-allowlist.json 中未到期的精确条目（类/方法ID），
      # 禁用解除未删条目同样失败；替代旧的 allowed_skipped=3 数量口径
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: 集成测试跳过精确白名单校验（测试ID+原因+期限，R28）
        run: node scripts/ci/check-it-skips.mjs
      # R26：宠物模块专属门禁——发布阻断级改造要求 mall-pet 专属 IT 非零
      - name: 宠物模块专属 IT 门禁
        run: |
          pet_total=$(find mall-pet -path "*failsafe-reports*" -name "*.txt" -exec grep -hE "^Tests run:" {} \; | awk -F'[:,]' '{s+=$2} END {print s+0}')
          echo "mall-pet failsafe 执行数: $pet_total"
          if [ "$pet_total" -eq 0 ]; then
            echo "::error::mall-pet 专属集成测试未执行（宠物发布门禁要求非零）"; exit 1
          fi
      # C26：每次创建独立 MySQL，核对全部表/索引/约束/种子，验证二次启动和拒绝漂移。
      - name: 全新数据库基线与 Flyway 保护验证
        run: python3 scripts/db-baseline/run.py verify --mysql-image mysql:9.7.0
      # T26 第 4 点 / R28：存量库续跑路径——migrate 到次末版本（作为"上个已发布版本"
      # 的代理；仓库尚无 release tag），灌入该版本 schema 下的代表存量数据后再续跑
      # head（等价真实发布滚动升级；空库路径由上一步覆盖）。只做空结构升级无法发现
      # 生成列/唯一约束/数据回填对存量行的破坏，故关键模块须提供
      # src/test/resources/migration/representative-data.sql 与 -check.sql
      - name: 存量库续跑验证（上个版本+代表数据 → head，R28）
        run: |
          docker run -d --name upgrade-db -e MYSQL_ROOT_PASSWORD=root -p 33061:3306 mysql:9.7.0
          ready=0
          for i in $(seq 1 60); do
            if docker exec upgrade-db mysql -h127.0.0.1 -uroot -proot -e "SELECT 1" >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::upgrade-db 120s 内未就绪"; exit 1
          fi
          failed=0
          for dir in mall-*/src/main/resources/db/migration; do
            module=$(echo "$dir" | cut -d/ -f1)
            db="upgrade_${module}"
            last=$(ls "$dir" | grep -oE '^V[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
            prev=$(ls "$dir" | grep -oE '^V[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -2 | head -1)
            count=$(ls "$dir" | grep -cE '^V[0-9]+__.*[.]sql$')
            if [ "$count" -lt 2 ]; then
              echo "BASELINE ONLY: $module 已由全新库+二次 validate 门禁覆盖"; continue
            fi
            echo "::group::存量续跑: $module (V${prev} → V${last})"
            docker exec upgrade-db mysql -uroot -proot -e "DROP DATABASE IF EXISTS \`${db}\`; CREATE DATABASE \`${db}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
            fly() {
              docker run --rm --network host                 -v "$PWD/$dir:/flyway/sql:ro"                 flyway/flyway:11                 -url="jdbc:mysql://127.0.0.1:33061/${db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"                 -user=root -password=root -locations=filesystem:/flyway/sql -validateOnMigrate=true -baselineOnMigrate=false -cleanDisabled=true -ignoreMigrationPatterns= "$@"
            }
            if ! fly -target="$prev" migrate; then
              echo "::error::$module 迁移到上个版本 V${prev} 失败"; failed=1; echo "::endgroup::"; continue
            fi
            # R28：代表数据 + 断言（可选，关键数据迁移模块必须提供）。
            # fixture 必须按 V${prev} 表结构编写；新增迁移使 prev 推进后，CI 会
            # 强制维护者同步更新 fixture——代表数据是"上个发布版"的真实存量形态
            fixture="$module/src/test/resources/migration/representative-data.sql"
            check="$module/src/test/resources/migration/representative-data-check.sql"
            if [ -f "$check" ] && [ ! -f "$fixture" ]; then
              echo "::error::$module 提供了 check 但缺少 fixture（representative-data.sql）"; failed=1; echo "::endgroup::"; continue
            fi
            if [ -f "$fixture" ]; then
              echo "灌入代表存量数据: $fixture（V${prev} schema）"
              if ! docker exec -i upgrade-db mysql -uroot -proot --default-character-set=utf8mb4 "$db" < "$fixture"; then
                echo "::error::$module 代表数据灌入失败（fixture 必须兼容 V${prev} schema）"; failed=1; echo "::endgroup::"; continue
              fi
            fi
            if ! fly migrate; then
              echo "::error::$module 存量库 V${prev}（含代表数据） → V${last} 续跑失败"; failed=1; echo "::endgroup::"; continue
            fi
            if [ -f "$fixture" ]; then
              if [ ! -f "$check" ]; then
                echo "::error::$module 有代表数据但缺少断言 representative-data-check.sql"; failed=1
              else
                result=$(docker exec -i upgrade-db mysql -uroot -proot -N --default-character-set=utf8mb4 "$db" < "$check" | tr -d '\r' | tail -1)
                echo "$module 代表数据断言: $result"
                if [ "$result" != "OK" ]; then
                  echo "::error::$module 代表数据迁移后语义断言失败: $result"; failed=1
                fi
              fi
            fi
            echo "OK: $module 续跑通过"
            echo "::endgroup::"
          done
          docker rm -f upgrade-db >/dev/null 2>&1 || true
          exit $failed
      - name: 失败摘要
        if: failure()
        run: |
          for f in $(find . -name "*.txt" -path "*failsafe-reports*"); do
            grep -E "Tests run: [0-9]+, Failures: [1-9]|Errors: [1-9]" "$f" | while read -r line; do
              echo "::error::[$f] $line"
            done
          done

  frontend:
    name: 三端类型检查、单测与生产构建
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # R28：三端统一"锁文件干净安装 → 类型检查 → npm test 单测 → 生产构建"门禁

          - dir: CloudMart-ui
            cmds: npm run typecheck && npm test -- --maxWorkers=1 --pool=threads && npm run build
          - dir: cloudmart-app
            # R28：tsc 前必须先用官方生成器产出 .expo/types/router.d.ts（typedRoutes
            # 已开启），否则 Href 静默回退宽 string，错误路由无法在类型期发现
            cmds: npm run typecheck && npm test && npx expo export --platform web
          - dir: cloudmart-mobile
            cmds: npx tsc --noEmit && npm test && npm run build:h5 && npm run build:weapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: 环境信息
        run: node --version && npm --version
      - name: 安装依赖（锁文件严格模式）
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: 校验与生产构建
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmds }}
      - name: 失败摘要
        if: failure()
        run: echo "::error::dir=${{ matrix.dir }} node=$(node --version) npm=$(npm --version) 上一步失败，见上方日志"

  guards:
    name: 仓库守门（路由策略 + 密钥扫描）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: 路由权限清单 lint（S05：重复键/非法 YAML/必填字段）
        run: node scripts/ci/route-policy-lint.mjs
      - name: 路由清单对照真实 Controller（T25 辅助检查；权威注解门禁见下一步 RouteGuardTest）
        run: node scripts/ci/route-inventory.mjs
      - name: CI 脚本自测（R28：IT 跳过精确门禁的变异场景）
        run: node --test scripts/ci/check-it-skips.test.mjs
      - name: 仓库卫生门禁（C36：制品/依赖/凭据载体不得入库）
        run: node scripts/ci/check-repo-hygiene.mjs
      - name: C36 门禁自测（前端孤立/后端死代码与 Feign 契约/Cocos 资源/悬空引用）
        run: |
          node --test scripts/ci/check-frontend-orphans.test.mjs \
                             scripts/ci/check-backend-orphans.test.mjs \
                             scripts/ci/check-cocos-assets.test.mjs \
                             scripts/ci/check-dangling-refs.test.mjs
      - name: 前端模块可达性门禁（C36-1：确定孤立模块）
        run: node scripts/ci/check-frontend-orphans.mjs
      - name: 后端可达性门禁（C36-2：private 死方法 + Feign→Controller 契约）
        run: node scripts/ci/check-backend-orphans.mjs
      - name: Cocos 资源完整性门禁（C36-3：meta 齐全/uuid 唯一/引用无断链）
        run: node scripts/ci/check-cocos-assets.mjs
      - name: 悬空引用门禁（C36-4：删文件后无悬空 import/脚本/文档链接）
        run: node scripts/ci/check-dangling-refs.mjs
      - name: 设置 JDK（R27 路由注解门禁）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      # Windows 开发的仓库不带 +x 位：不 chmod 则 ./mvnw 以 exit 126 失败
      - name: 赋予 mvnw 执行权限
        run: chmod +x mvnw
      - name: R27 路由注解门禁（Spring 真实解析：全限定/多路径/继承/@RequiresPermission，含 mall-pet）
        run: >-
          ./mvnw -B -ntp -pl mall-admin,mall-ai,mall-auth,mall-cart,mall-community,mall-coupon,
          mall-file,mall-gen,mall-inventory,mall-job,mall-live,mall-marketing,mall-notification,
          mall-order,mall-payment,mall-pet,mall-product,mall-risk,mall-seckill,mall-user,mall-wish,mall-wms
          -am test -Dtest=RouteGuardTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: 密钥泄漏扫描（gitleaks）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
