server:
  port: 9023

common:
  jsafe-long:
    enabled: false # B07：由 PetJsonMapperCustomizer 接管（Long 全量转字符串）

spring:
  application:
    name: mall-pet
  autoconfigure:
    exclude: org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
  config:
    import:
      - optional:nacos:mall-pet.yml?refreshEnabled=true
      - optional:nacos:shared-logging.yml?group=DEFAULT_GROUP&refresh=true
  cloud:
    inetutils:
      preferred-networks:
        - 192.168.1.
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
    sentinel:
      transport:
        dashboard: 127.0.0.1:8088
        port: 8743
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:8306}/mall_pet?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:8379}
      # 与 mall-wish 同策略：3s 快速失败走 Fail-Open（限频计数短暂放行优于阻断主流程）
      timeout: 3s
      connect-timeout: 2s
  ai:
    # OpenAI 兼容协议（Spring AI OpenAI starter）：默认指向智谱开放平台 GLM 系列，
    # 与 mall-wish 树洞/助手共用同一套环境变量；聊天降级模板保证 AI 故障不中断陪伴体验
    openai:
      base-url: ${AI_BASE_URL:https://open.bigmodel.cn}
      api-key: ${AI_API_KEY:sk-placeholder}
      chat:
        completions-path: ${AI_CHAT_COMPLETIONS_PATH:/api/paas/v4/chat/completions}
        options:
          model: ${AI_CHAT_MODEL:glm-4.5-air}
          temperature: 0.8
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${spring.application.name}-producer-group
    send-message-timeout: 3000

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.cloudmart.pet: DEBUG
    com.alibaba.csp.sentinel: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    enable-version: false
    enable-reload-cache: false
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-api-method-type-size: 10
    enable-request-cache: true
    enable-host: false
    enable-host-text: 127.0.0.1:9023
    enable-home-custom: false
    enable-search: false
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: CloudMart 社区宠物模块 API 文档
    enable-dynamic-parameter: false
    enable-debug: true
    enable-open-api: false
    enable-group: true
    enable-cors: false
    cors-allow-origins: []
    cors-allow-headers: []
    cors-allow-methods: []
    cors-allow-credentials: false
    cors-max-age: 3600

# 社区宠物模块业务配置（支持 Nacos 热更新）
pet:
  # 状态自然变化速率（每小时；懒更新按 elapsed 截断 48h，见 PetProperties）
  decay:
    hunger-per-hour: 2.0
    happiness-per-hour: 1.0
    energy-recover-per-hour: 3.0
    cleanliness-per-hour: 1.5
    max-idle-hours: 48
  # 升级曲线：expToNext(level) = base * level^1.5
  level:
    exp-base: 100
  # 基础互动数值（每日次数按 UTC 日计）
  interaction:
    feed-daily-limit: 5
    feed-hunger: 30
    feed-happiness: 5
    feed-hp: 10
    feed-exp: 2
    play-energy: 15
    play-happiness: 20
    play-exp: 8
    clean-cleanliness: 40
    clean-happiness: 5
    clean-exp: 2
    rest-hunger: 5
  # 捞漂流瓶
  bottle:
    # 任务时长（秒，文档建议 30 分钟）
    duration-seconds: 1800
    # 完成后冷却（秒）
    cooldown-seconds: 600
    # 基础成功率 + 敏捷/等级加成（封顶 95%），服务端 roll
    base-success-rate: 0.70
    agility-bonus-rate: 0.005
    level-bonus-rate: 0.01
    max-success-rate: 0.95
  # 对战
  battle:
    # PENDING 挑战过期（小时）
    pending-expire-hours: 48
    win-exp: 30
    lose-exp: 10
    win-currency: 20
    max-rounds: 15
  # 聊天
  chat:
    # 单用户每日聊天上限（防 AI 成本失控）
    daily-limit: 20
    max-retries: 2
    retry-interval-ms: 1000
    # 记忆条数上限（按 importance 排序注入 prompt）
    memory-limit: 10
  # 主动消息频控（文档 §32：每日 <= 3）
  proactive:
    daily-limit: 3
    min-interval-seconds: 60
