# ShardingSphere 分表 Profile
# 启用方式: spring.profiles.active=sharding
# 此时数据源由 ShardingSphere 管理，Flyway 使用物理 MySQL 连接校验/迁移，逻辑分片连接不执行 DDL

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
  datasource:
    url: jdbc:shardingsphere:classpath:sharding-config.yaml
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
  flyway:
    enabled: true
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:8306}/mall_order?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    user: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    ignore-migration-patterns: []
    clean-disabled: true

shardingsphere:
  enabled: true
