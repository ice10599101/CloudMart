# 集成测试专用配置（Sprint 1.4）
# 基础设施：docker-compose.yml 中 mysql-it(8307)/redis-it(8380) 专用容器，
# 与业务实例(8306/8379)完全隔离，可随时销毁重建。
# 容器启动：docker compose up -d mysql-it redis-it（远程服务器与本机 compose 同步）
spring:
  datasource:
    url: jdbc:mysql://${WISH_IT_MYSQL_HOST:129.204.152.168}:${WISH_IT_MYSQL_PORT:8307}/mall_wish_it?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  flyway:
    # 集成测试库每次全量迁移校验，验证 Flyway 契约
    clean-disabled: true
    validate-on-migrate: false
  data:
    redis:
      host: ${WISH_IT_REDIS_HOST:129.204.152.168}
      port: ${WISH_IT_REDIS_PORT:8380}

# 集成测试关闭 AI 重试等待，加速失败场景用例
wish:
  ai:
    retry-interval-ms: 0
  # 测试专用敏感词词库（生产词库由运营维护，经 Nacos 下发；此处仅保证集成测试确定性）
  sensitive-words: 骗局,诈骗

logging:
  level:
    com.cloudmart.wish: INFO
    org.springframework.cloud.openfeign: WARN
    com.alibaba.nacos.client: WARN
