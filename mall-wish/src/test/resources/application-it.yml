# 集成测试专用配置（Sprint 1.4 / T26 双模式）
# 默认：Testcontainers 自给自足（WishIntegrationTestBase 自起真实 MySQL9+Redis，
#       CI runner 自带 Docker；容器属性经 @DynamicPropertySource 覆盖本文件）
# 外部容器：仅当显式设置 WISH_IT_MYSQL_HOST 时启用（授权环境 mysql-it:8307 /
#       redis-it:8380 共享实例，须同时 -Dwish.it.enabled=true + 运行锁；
#       不再提供任何硬编码默认主机——不依赖私人远程机器）
spring:
  datasource:
    url: jdbc:mysql://${WISH_IT_MYSQL_HOST:}:${WISH_IT_MYSQL_PORT:8307}/mall_wish_it?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  flyway:
    # 集成测试库每次全量迁移校验，验证 Flyway 契约
    clean-disabled: true
    validate-on-migrate: false
  data:
    redis:
      host: ${WISH_IT_REDIS_HOST:}
      port: ${WISH_IT_REDIS_PORT:8380}

# 集成测试关闭 AI 重试等待，加速失败场景用例
wish:
  security:
    # IT 专用服务令牌密钥（仅隔离测试环境；生产经部署密钥注入，B01 fail fast）
    service-token-secret: it-isolated-wish-service-token-secret-0123456789abcdef
    clock-skew-seconds: 30
  ai:
    retry-interval-ms: 0
  # 测试专用敏感词词库（生产词库由运营维护，经 Nacos 下发；此处仅保证集成测试确定性）
  sensitive-words: 骗局,诈骗

logging:
  level:
    com.cloudmart.wish: INFO
    org.springframework.cloud.openfeign: WARN
    com.alibaba.nacos.client: WARN
