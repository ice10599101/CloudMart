server:
  port: 9022

spring:
  application:
    name: mall-wish
  autoconfigure:
    exclude: org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
  config:
    import:
      - optional:nacos:mall-wish.yml?refreshEnabled=true
      - optional:nacos:shared-logging.yml?group=DEFAULT_GROUP&refresh=true
  cloud:
    inetutils:
      preferred-networks:
        - 192.168.1.
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
    sentinel:
      transport:
        dashboard: 127.0.0.1:8088
        port: 8741
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:8306}/mall_wish?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration,classpath:com/cloudmart/wish/db/migration
    clean-disabled: true
    # B23：正式环境先 validate 再 migrate（历史 checksum 差异在发布前修正，不靠 repair 掩盖）
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:8379}
      # Lettuce 默认命令超时 60s——远超前端 15s 请求超时；服务器 Docker 端口
      # 转发抖动时半开连接会把聚合请求拖到客户端超时。3s 快速失败走 Fail-Open 回源 DB
      timeout: 3s
      connect-timeout: 2s
  ai:
    # OpenAI 兼容协议（Spring AI OpenAI starter）：默认指向智谱开放平台 GLM 系列。
    # 切换其他 OpenAI 兼容服务商（DashScope compatible-mode / DeepSeek / Kimi 等）
    # 仅需改 base-url、completions-path、model 三个值，代码零改动。
    openai:
      base-url: ${AI_BASE_URL:https://open.bigmodel.cn}
      api-key: ${AI_API_KEY:sk-placeholder}
      chat:
        completions-path: ${AI_CHAT_COMPLETIONS_PATH:/api/paas/v4/chat/completions}
        options:
          # 树洞治愈回复场景模型（低成本低延迟；GLM-4.5-Flash 免费档可作降级备选）
          model: ${AI_CHAT_MODEL:glm-4.5-air}
          temperature: 0.8
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${spring.application.name}-producer-group
    send-message-timeout: 3000

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # P2-21 生产硬化：默认 INFO（原 DEBUG 仅本地联调用，环境变量覆盖恢复）
    com.cloudmart.wish: INFO
    org.springframework.cloud.openfeign: INFO
    org.springframework.cloud.loadbalancer: INFO
    com.alibaba.nacos.client: INFO
    com.alibaba.csp.sentinel: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    # E03：生产注入 SPRINGDOC_SWAGGER_UI_ENABLED=false 关闭
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
  api-docs:
    # E03：生产注入 SPRINGDOC_API_DOCS_ENABLED=false 关闭
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  default-flat-param-object: true


# 心愿模块业务配置（支持 Nacos 热更新）
wish:
  security:
    # B01 身份边界：用户身份由可验证 JWT 建立（网关透传 Authorization，本服务自行验签）；
    # 服务身份由 X-Service-Token（HS256 短期令牌）建立，按路径强校验 iss/aud/scope。
    # 共享密钥由部署环境注入，禁止写入仓库；缺失时启动失败（fail fast）。
    service-token-secret: ${WISH_SERVICE_TOKEN_SECRET:}
    # mall-auth JWKS（RS256 公钥），与网关一致
    jwks-uri: ${WISH_JWKS_URI:http://127.0.0.1:9001/oauth2/jwks}
    # 令牌时钟偏移容忍
    clock-skew-seconds: 30
  ai:
    # 树洞单用户每日调用上限（文档 30.3：10 次/日）
    tree-hole-daily-limit: 10
    # 大模型调用失败重试次数（不含首次；文档 30.3：重试 2 次）
    max-retries: 2
    # 重试间隔毫秒（文档 30.3：间隔 1s；测试环境可置 0）
    retry-interval-ms: 1000
    # 危机关键词：命中后本地拦截，不发送大模型服务（文档 30.4 数据安全）
    crisis-keywords:
      - 自杀
      - 自残
      - 轻生
      - 不想活
      - 想死
      - 结束生命
      - 伤害自己
      - 了结自己
    # 心理援助热线资源（危机场景返回，文档 12.2 树洞系统专用）
    hotline-resources:
      - type: HOTLINE
        title: 全国心理援助热线
        url: tel:12356
      - type: HOTLINE
        title: 北京心理危机研究与干预中心热线
        url: tel:010-82951332
  # 生命树情绪环境联动（文档 2.2 气象情绪联动 / Sprint 2.2；阈值与窗口可经 Nacos 热更新）
  tree-env:
    # 情绪聚合滑动窗口（分钟，文档 2.2：1 小时）
    mood-window-minutes: 60
    # 时间衰减系数 λ（权重 w=exp(-λ×年龄分钟)；0.0231≈1 小时衰减至 25%）
    mood-decay-lambda: 0.0231
    # 下雨阈值（文档 2.2：mood < -0.6 触发 RAIN）
    rain-threshold: -0.6
    # 彩虹阈值（文档 2.2：mood > +0.3 触发 RAINBOW）
    rainbow-threshold: 0.3
    # 下雨最短持续（分钟，文档 2.2：30）
    rain-min-duration-minutes: 30
    # 彩虹持续（分钟，文档 2.2：15）
    rainbow-duration-minutes: 15
    # BLESS 突增检测窗口（分钟，当前窗口 vs 前一窗口对比）
    bless-burst-window-minutes: 15
    # BLESS 突增最小计数（低基数防误报）
    bless-burst-min-count: 5
    # BLESS 突增倍率（当前 ≥ 前窗口 × 倍率）
    bless-burst-multiplier: 2.0
    # Redis 聚合分数缓存 TTL（分钟，文档 2.2：10）
    mood-cache-ttl-minutes: 10
    # 扫描互斥锁 TTL（秒）
    scan-lock-ttl-seconds: 240
    # 天气 API（Sprint 2.2 和风天气 v7，文档 28.1.2；未配 Key 时降级晴天）
    weather:
      enabled: ${QWEATHER_ENABLED:false}
      # 和风天气 API Key（敏感配置走环境变量注入，禁止硬编码）
      api-key: ${QWEATHER_API_KEY:}
      # 天气查询位置（和风 LocationID，默认北京；全站单点天气）
      location: ${QWEATHER_LOCATION:101010100}
      # API Host（开发版 devapi；商业版换 https://api.qweather.com）
      host: ${QWEATHER_HOST:https://devapi.qweather.com}
      # Redis 天气缓存 TTL（分钟，验收：5 分钟不重复请求）
      cache-ttl-minutes: 5

# 平台级邮件验证码通道（mall-common 泛化组件，注销发码经此下发；
# 部署优先注入 CLOUDMART_MAIL_*，兼容历史 WISH_MAIL_* 环境变量）
cloudmart:
  mail:
    host: ${CLOUDMART_MAIL_HOST:${WISH_MAIL_HOST:}}
    port: ${CLOUDMART_MAIL_PORT:${WISH_MAIL_PORT:465}}
    username: ${CLOUDMART_MAIL_USERNAME:${WISH_MAIL_USERNAME:}}
    password: ${CLOUDMART_MAIL_PASSWORD:${WISH_MAIL_PASSWORD:}}
    from: ${CLOUDMART_MAIL_FROM:${WISH_MAIL_FROM:}}
  security:
    # T02：心愿接入统一身份边界——用户/管理员 JWT 由公共 UserJwtAuthenticationFilter
    # 完整验签（iss/aud/exp/nbf/身份域/会话撤销 authVersion），service-id 触发公共
    # 过滤器装配；管理员令牌不再被本地过滤器视作普通用户
    service-id: mall-wish
    # 密钥/JWKS/时钟偏移沿用 wish.security.* 原配置源（环境变量或 Nacos 覆盖），部署零切换
    service-token-secret: ${wish.security.service-token-secret:}
    jwks-uri: ${wish.security.jwks-uri:http://127.0.0.1:9001/oauth2/jwks}
    clock-skew-seconds: ${wish.security.clock-skew-seconds:30}
    # 入站服务令牌路径强映射（原 wish-local 过滤器 PATH_REQUIREMENTS 平移，最长前缀优先）
    service-token-paths:
      - prefix: /admin
        issuers: [mall-admin]
        scope: wish:admin
      - prefix: /internal/jobs
        issuers: [mall-job]
        scope: wish:jobs
      - prefix: /internal/tree-env
        issuers: [mall-job]
        scope: wish:jobs
      - prefix: /internal/pet-support
        issuers: [mall-pet]
        scope: wish:pet
      - prefix: /internal/starlight
        issuers: [mall-product, mall-user]
        scope: wish:starlight
      - prefix: /internal/account-erasure
        issuers: [mall-user]
        scope: wish:erasure
    # T09：跨域经验发奖出站签名（iss=mall-wish, aud=mall-community, scope=community:internal）
    outbound-scopes:
      mall-community: community:internal
      # 心愿关联商品闭环（§6）：还愿购买凭证校验（/internal/orders/purchase-evidence）
      mall-order: order:internal
