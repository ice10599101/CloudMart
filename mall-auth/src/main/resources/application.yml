server:
  port: 9001

spring:
  application:
    name: mall-auth
  config:
    import:
      - optional:nacos:mall-auth.yml?server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}&refreshEnabled=true
      - optional:nacos:shared-logging.yml?group=DEFAULT_GROUP&server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}&refresh=true
  cloud:
    inetutils:
      preferred-networks:
        - 192.168.1.
    openfeign:
      circuitbreaker:
        enabled: true
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
    sentinel:
      transport:
        dashboard: 127.0.0.1:8088
        port: 8730
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:8379}

auth:
  jwt:
    access-token-expiration: 900
    refresh-token-expiration: 604800

feign:
  sentinel:
    enabled: true

logging:
  level:
    com.cloudmart.admin.feign: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    com.alibaba.nacos.client: DEBUG
    com.alibaba.csp.sentinel: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# SEC-01 统一身份边界：用户/管理员 JWT 本地验签（RS256/JWKS），服务间调用以
# X-Service-Token 短期签名令牌认证（与全站共享 CLOUDMART_SERVICE_TOKEN_SECRET）。
# 裸 X-Internal-Call 头不再构成任何信任凭证。
cloudmart:
  security:
    service-id: mall-auth
    service-token-secret: ${CLOUDMART_SERVICE_TOKEN_SECRET:}
    jwks-uri: ${CLOUDMART_SECURITY_JWKS_URI:http://127.0.0.1:9001/oauth2/jwks}
    clock-skew-seconds: 30
    service-token-ttl-seconds: 60
    service-token-paths:
      - prefix: /internal
        issuers: [mall-admin, mall-user]
        scope: admin:auth
    outbound-scopes:
      mall-admin: admin:auth
    user-jwt-verification-enabled: false
