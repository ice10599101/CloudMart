server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /promtail/positions.yml

clients:
  - url: http://cloudmart-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cloudmart-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: cloudmart
          environment: development
          __path__: /var/log/microservices/**/application*.log
    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
          max_wait_time: 3s
          max_lines: 128
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)\s+\[(?P<thread>[^\]]+)\]\s+\[(?P<requestId>[^\]]*)\]\s+(?P<level>\w+)\s+(?P<logger>\S+)\s+-\s+(?P<message>.*)$'
      - labels:
          level:
          logger:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000'
          fallback_formats:
            - '2006-01-02 15:04:05'
          location: "Asia/Shanghai"
