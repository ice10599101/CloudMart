# 集成测试专用配置（与 mall-wish 同一套双模式约定）
# 默认：Testcontainers 自给自足（SoftwareIntegrationTestBase 自起真实 MySQL9+Redis）
# 外部容器：仅当显式设置 CLOUDMART_IT_MYSQL_HOST 时启用（须同时 -Dsoftware.it.enabled=true）
spring:
  datasource:
    url: jdbc:mysql://${CLOUDMART_IT_MYSQL_HOST:}:${CLOUDMART_IT_MYSQL_PORT:8307}/mall_software_it?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  flyway:
    # 集成测试库每次全量迁移校验，验证 Flyway 契约
    clean-disabled: true
    validate-on-migrate: true
    ignore-migration-patterns: []
  data:
    redis:
      host: ${CLOUDMART_IT_REDIS_HOST:}
      port: ${CLOUDMART_IT_REDIS_PORT:8380}

software:
  # IT 全开关打开（开关语义本身由单测/e2e 覆盖；IT 聚焦持久化与并发边界）
  enabled: true
  publish-enabled: true
  resolve-enabled: true
  subscription-enabled: true
  rankings-enabled: true
  # 日级限流关闭（0=不限）：IT 用例密集提交/反馈/举报，限流阈值语义由单测覆盖
  publish-submissions-per-user-day: 0
  feedback-per-user-day: 0
  report-per-user-day: 0
  # 分钟级限流同样关闭（并发用例会瞬间打满）
  comment-per-user-minute: 0
  resolve-per-user-minute: 0

cloudmart:
  security:
    # IT 专用服务令牌密钥（仅隔离测试环境；生产经部署密钥注入）
    service-id: mall-software
    service-token-secret: it-isolated-software-service-token-secret-0123456789abcdef

logging:
  level:
    com.cloudmart.software: INFO
    org.springframework.cloud.openfeign: WARN
    com.alibaba.nacos.client: WARN
