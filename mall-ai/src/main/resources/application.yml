server:
  port: 9013

spring:
  application:
    name: mall-ai
  config:
    import:
      - optional:nacos:mall-ai.yml?refreshEnabled=true
      - optional:nacos:shared-logging.yml?group=DEFAULT_GROUP&refresh=true
  cloud:
    inetutils:
      preferred-networks:
        - 192.168.1.
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
  ai:
    # OpenAI 兼容协议（Spring AI OpenAI starter）：默认指向智谱开放平台 GLM 系列。
    # 切换其他 OpenAI 兼容服务商仅改 base-url / completions-path / embeddings-path / model。
    openai:
      base-url: ${AI_BASE_URL:https://open.bigmodel.cn}
      api-key: ${AI_API_KEY:sk-placeholder}
      chat:
        completions-path: ${AI_CHAT_COMPLETIONS_PATH:/api/paas/v4/chat/completions}
        options:
          model: ${AI_CHAT_MODEL:glm-4.5-air}
          temperature: 0.7
      # 注意前缀是单数 embedding（spring-ai 2.0.0-M1 属性元数据如此定义）
      embedding:
        embeddings-path: ${AI_EMBEDDINGS_PATH:/api/paas/v4/embeddings}
        options:
          model: ${AI_EMBEDDING_MODEL:embedding-3}
          # 与历史 text-embedding-v3（1024 维）对齐，保证已建 ES 向量索引维度兼容
          dimensions: 1024
  elasticsearch:
    uris: ${ES_URIS:http://127.0.0.1:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:8379}
      # Lettuce 默认命令超时 60s；服务器端口转发抖动时半开连接会拖死请求。
      # 3s 快速失败（与 mall-wish 对齐，见进度文件四K 第八轮）
      timeout: 3s
      connect-timeout: 2s

ai:
  search:
    product-service-url: ${PRODUCT_SERVICE_URL:http://mall-product}
    enabled: ${AI_SEARCH_ENABLED:true}
  vector:
    enabled: ${AI_VECTOR_ENABLED:false}
    index-name: ${AI_VECTOR_INDEX:cloudmart_product_vectors}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.cloudmart.admin.feign: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    com.alibaba.nacos.client: DEBUG
    com.alibaba.csp.sentinel: WARN

# SEC-01 统一身份边界：用户/管理员 JWT 本地验签（RS256/JWKS），服务间调用以
# X-Service-Token 短期签名令牌认证（与全站共享 CLOUDMART_SERVICE_TOKEN_SECRET）。
# 裸 X-Internal-Call 头不再构成任何信任凭证。
cloudmart:
  security:
    service-id: mall-ai
    service-token-secret: ${CLOUDMART_SERVICE_TOKEN_SECRET:}
    jwks-uri: ${CLOUDMART_SECURITY_JWKS_URI:http://127.0.0.1:9001/oauth2/jwks}
    clock-skew-seconds: 30
    service-token-ttl-seconds: 60
    service-token-paths:
      - prefix: /admin
        issuers: [mall-admin]
        scope: ai:admin
      - prefix: /chat
        issuers: [mall-admin]
        scope: ai:admin
      - prefix: /search
        issuers: [mall-admin]
        scope: ai:admin
      - prefix: /internal
        issuers: [mall-job]
        scope: ai:internal
    outbound-scopes:
      mall-product: product:read
