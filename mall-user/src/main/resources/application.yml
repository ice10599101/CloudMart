server:
  port: 9002

spring:
  application:
    name: mall-user
  autoconfigure:
    exclude: org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
  config:
    import:
      - nacos:shared-runtime.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:mall-user.yml?refreshEnabled=true
      - optional:nacos:shared-logging.yml?group=DEFAULT_GROUP&refresh=true
  cloud:
    inetutils:
      preferred-networks:
        - 192.168.1.
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
    sentinel:
      transport:
        dashboard: 127.0.0.1:8088
        port: 8728
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:8379}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:8306}/mall_user?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    ignore-migration-patterns: []

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # P2-21 生产硬化：默认 INFO（原 DEBUG 仅本地联调用）。
    # 本地调试用环境变量覆盖，如 LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_OPENFEIGN=DEBUG
    com.cloudmart.admin.feign: INFO
    org.springframework.cloud.openfeign: INFO
    org.springframework.cloud.loadbalancer: INFO
    com.alibaba.nacos.client: INFO
    com.alibaba.csp.sentinel: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# SEC-01 统一身份边界：用户/管理员 JWT 本地验签（RS256/JWKS），服务间调用以
# X-Service-Token 短期签名令牌认证（与全站共享 CLOUDMART_SERVICE_TOKEN_SECRET）。
# 裸 X-Internal-Call 头不再构成任何信任凭证。
cloudmart:
  # 注册邮箱验证码：SMTP 通道（mall-common 平台组件，未配置则发码如实 sent=false）。
  # C24：统一只认 CLOUDMART_MAIL_*（与 mall-wish 注销发码共用同一套服务器变量）
  mail:
    host: ${CLOUDMART_MAIL_HOST:}
    port: ${CLOUDMART_MAIL_PORT:465}
    username: ${CLOUDMART_MAIL_USERNAME:}
    password: ${CLOUDMART_MAIL_PASSWORD:}
    from: ${CLOUDMART_MAIL_FROM:}
  security:
    service-id: mall-user
    service-token-secret: ${CLOUDMART_SERVICE_TOKEN_SECRET:}
    jwks-uri: ${CLOUDMART_SECURITY_JWKS_URI:http://127.0.0.1:9001/oauth2/jwks}
    clock-skew-seconds: 30
    service-token-ttl-seconds: 60
    service-token-paths:
      - prefix: /admin/users
        issuers: [mall-admin, mall-notification]
        scope: user:admin
      - prefix: /admin
        issuers: [mall-admin]
        scope: user:admin
      # SEC-04：内部端点——mall-auth 凭据验证 / wish 等服务聚合注销进度
      - prefix: /internal/users
        issuers: [mall-auth, mall-order, mall-marketing]
        scope: user:internal
      # 小答软件只读适配（9.6）：批量最小资料窄接口，独立最小能力域
      - prefix: /internal/software-support
        issuers: [mall-software]
        scope: user:software-support
      - prefix: /users/account-deletion/status
        issuers: [mall-wish]
        scope: user:internal
      # OPS-03：注销任务运维台账（mall-admin 异常处理中心代理）——
      # 缺失时 @PreAuthorize(INTERNAL) 匿名拒绝 → 401"请先登录"（真实环境实测暴露）
      - prefix: /users/account-deletion/internal
        issuers: [mall-admin]
        scope: user:admin
      # WISH-04：邀请资格回调（mall-wish 签到事务提交后触发）
      - prefix: /invites/internal
        issuers: [mall-wish]
        scope: user:internal
      # OPS-03：注销任务运维台账（mall-admin 异常处理中心代理）——
      # 缺失时 @PreAuthorize(INTERNAL) 匿名拒绝 → 401"请先登录"（真实环境实测暴露）
      - prefix: /users/account-deletion/internal
        issuers: [mall-admin]
        scope: user:admin
      # WISH-04：邀请资格回调（mall-wish 签到事务提交后触发）
      - prefix: /invites/internal
        issuers: [mall-wish]
        scope: user:internal
    outbound-scopes:
      mall-auth: admin:auth
      # USER-01：注销阻塞核验（/internal/orders/has-open-orders）
      mall-order: order:internal
      # R07：邀请奖励交付（/internal/starlight/earn，义务台账补发）
      mall-wish: wish:starlight
      # T06：注销分域擦除（community 复用既有 internal scope）
      mall-community: community:internal
      mall-notification: notification:internal
      mall-file: file:internal
      # 11.3：软件域注销（/internal/account-erasure，SOFTWARE/ERASE 编排步骤）
      mall-software: software:erasure

# 注册发码：echo-code 仅供无邮件通道的开发/测试环境回显验证码，生产必须关闭
user:
  register:
    echo-code: ${USER_REGISTER_ECHO_CODE:false}

# E03：公开文档按需关闭——生产部署注入 SPRINGDOC_API_DOCS_ENABLED=false 与
# SPRINGDOC_SWAGGER_UI_ENABLED=false；dev/test 保持默认开启
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
